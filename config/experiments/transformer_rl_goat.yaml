# @package _global_

defaults:
  - /habitat: habitat_config_base
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat_baselines/rl/policy/obs_transforms:
    - resize
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgb_agent
  - /habitat/task: task_config_base
  - /habitat/task/actions:
    - stop
    - move_forward
    - turn_left
    - turn_right
    - look_up
    - look_down
  - /habitat/task/measurements:
    - distance_to_goal
    - success
    - spl
    - soft_spl
    - distance_to_goal_reward
  - /habitat/task/lab_sensors:
    - step_id_sensor
    - goat_goal_sensor
    # - goat_modal_type_sensor
    # - goat_episode_id_sensor
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
    max_episode_steps: 500
  task:
    type: Goat-v1
    success_reward: 2.5
    slack_reward: -1e-3
    reward_measure: distance_to_goal_reward
    # success_measure: success
    # 下面两个是对齐objnav的
    success_measure: spl
    end_on_success: True
    lab_sensors:
      goat_goal_sensor:
        object_cache: tmp/ovon/category_name_siglip_embeddings.pkl
        image_cache: tmp/iin/train_embeddings/
        image_cache_encoder: siglip

    measurements:
      success:
        success_distance: 0.25
      distance_to_goal:
        type: OVONDistanceToGoal
        distance_to: VIEW_POINTS
  dataset:
    type: "Goat-v1"
    split: train
    data_path: data/datasets/ovon/hm3d/v2_new/{split}/{split}.json.gz
  simulator:
    type: "OVONSim-v0"
    turn_angle: 30
    tilt_angle: 30
    action_space_config: "v1"
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 360
            height: 640
            hfov: 42
            position: [0, 1.31, 0]
        height: 1.41
        radius: 0.17
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: False
    navmesh_settings:
      agent_max_climb: 0.1
      cell_height: 0.05

habitat_baselines:
  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1
  eval_ckpt_path_dir: "data/new_checkpoints"
  num_environments: 8
  checkpoint_folder: "data/new_checkpoints"
  trainer_name: "ver_transformer"
  num_updates: -1
  total_num_steps: 150000000
  log_interval: 10
  num_checkpoints: 50
  # Force PyTorch to be single threaded as
  # this improves performance considerably
  force_torch_single_threaded: True

  eval:
    split: "val"

  rl:

    policy:
      name: "OVONTransformerPolicy"
      backbone: "siglip"
      fusion_type: "concat"
      use_vis_query: True
      use_residual: True
      residual_vision: True
      rgb_only: False
      transformer_config:
        model_name: "llama"
        n_layers: 4
        n_heads: 8
        n_hidden: 512
        n_mlp_hidden: 1024
        max_context_length: 100
        shuffle_pos_id_for_update: True

    ppo:
      # ppo params
      clip_param: 0.2
      ppo_epoch: 1
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 100
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 50

      use_normalized_advantage: False

      hidden_size: 512

    ddppo:
      sync_frac: 0.6
      # The PyTorch distributed backend to use
      distrib_backend: NCCL
      # Visual encoder backbone
      pretrained_weights: data/ddppo-models/gibson-2plus-resnet50.pth
      # Initialize with pretrained weights
      pretrained: False
      # Initialize just the visual encoder backbone with pretrained weights
      pretrained_encoder: False
      # Whether or not the visual encoder backbone will be trained.
      train_encoder: False
      # Whether or not to reset the critic linear layer
      reset_critic: True
    
    # for debug
    ver:
      num_inference_workers: 1
